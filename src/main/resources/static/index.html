<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Bill Calculator</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Shopping Bill Calculator</h1>
            <p>Manage items and calculate the final bill.</p>
        </header>

        <section class="form-panel">
            <h2>Add Product</h2>
            <form id="item-form">
                <div class="input-grid">
                    <input type="hidden" id="item-id" />
                    <div>
                        <label for="name">Product Name</label>
                        <input type="text" id="name" required />
                    </div>
                    <div>
                        <label for="category">Category</label>
                        <input type="text" id="category" required />
                    </div>
                    <div>
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" min="1" value="1" required />
                    </div>
                    <div>
                        <label for="price">Price</label>
                        <input type="number" id="price" min="0" step="0.01" required />
                    </div>
                    <div class="full-width">
                        <label for="description">Description</label>
                        <textarea id="description" rows="3"></textarea>
                    </div>
                </div>
                <div class="button-row">
                    <button type="submit" class="primary">Save Item</button>
                    <button type="button" id="reset-form" class="secondary">Clear</button>
                </div>
            </form>
        </section>

        <section class="summary-panel">
            <h2>Bill Summary</h2>
            <div class="bill-grid">
                <label>
                    Tax Rate (%)
                    <input type="number" id="tax-rate" value="10" min="0" step="0.01" />
                </label>
                <label>
                    Discount Rate (%)
                    <input type="number" id="discount-rate" value="0" min="0" step="0.01" />
                </label>
                <button id="calculate-bill" class="primary">Calculate</button>
            </div>
            <div class="totals">
                <div><span>Subtotal:</span> <strong id="subtotal">$0.00</strong></div>
                <div><span>Tax:</span> <strong id="tax">$0.00</strong></div>
                <div><span>Discount:</span> <strong id="discount">$0.00</strong></div>
                <div class="grand-total"><span>Total:</span> <strong id="total">$0.00</strong></div>
            </div>
        </section>

        <section class="items-panel">
            <h2>Items List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Qty</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="items-table-body"></tbody>
            </table>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
